# CircleCI configuration file
version: 2.1

jobs:
  # Job one with a unique name
  install:
    docker:
     - image: cimg/base:current
    steps:
      - run: echo "安装依赖"
      - run: npm install
  # Job two with a unique name
  build:
    docker:
     - image: cimg/base:current
    steps:
      - run: echo "执行构建!"
      - run: npm run build

workflows:
  # Name of workflow
  hello_and_goodbye:
    # List of jobs that will run
    jobs:
      - install
      - build